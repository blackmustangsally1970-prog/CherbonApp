<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wedding P&L</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .menu-btn {
                font-size: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<h1>💒 Wedding Dashboard</h1>

<ul class="menu">

    <li>
        <a href="{{ url_for('dashboard') }}" class="menu-btn">
            ← Main Menu
        </a>
    </li>

{% if current_user.role in ['admin', 'management', 'manager', 'coordinator'] %}
    <li>
        <a href="/weddings" class="menu-btn">
            💒 Weddings
        </a>
    </li>
{% endif %}

    <li>
        <a href="/wedding/dashboard" class="menu-btn">
            🗂 Wedding Dashboard
        </a>
    </li>

    <li>
        <a href="{{ url_for('user_dashboards') }}" class="menu-btn">
            🎛 Wedding User Dashboards
        </a>
    </li>

</ul>

</html>
