<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Enquiries</title>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
    }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

    /* Desktop override */
    @media (min-width: 800px) {
      .menu-btn {
        padding: 20px 18px !important;
        font-size: 20px !important;
        border-radius: 10px !important;
        margin-bottom: 16px !important;
      }
    }

  </style>
</head>

<body>

  <!-- SMALL MAIN MENU BUTTON -->

  <h1>📨 Enquiries</h1>






  <!-- BIG CHERBON BUTTONS -->
  <ul class="menu">


    <li>
      <a href="{{ url_for('equestrian_dashboard') }}" class="menu-btn">
        ← Equestrian Menu
      </a>
    </li>


    <li>
      <a href="{{ url_for('trailride_enquiries') }}" class="menu-btn">
        🐎 Trail Ride Enquiries
      </a>
    </li>

    <li>
      <a href="{{ url_for('general_enquiries') }}" class="menu-btn">
        📋 General Enquiries
      </a>
    </li>

  </ul>

</body>
</html>
