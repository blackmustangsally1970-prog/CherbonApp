<div class="container mt-4">

    <div class="mb-3">
        <a href="{{ url_for('wedding_pricing') }}" class="btn btn-secondary">
            ⬅ Back to Pricing Table
        </a>
    </div>

    <h2>Edit Pricing Tier</h2>
    <p class="text-muted">Modify the values and click Save.</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Wedding Type</label>
            <input type="text" name="wedding_type" class="form-control"
                   value="{{ row.wedding_type }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Guest Min</label>
            <input type="number" name="guest_min" class="form-control"
                   value="{{ row.guest_min }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Total Price</label>
            <input type="number" step="0.01" name="total_price"
                   class="form-control" value="{{ row.total_price }}" required>
        </div>

        <button class="btn btn-success btn-lg">Save Changes</button>

    </form>

</div>
