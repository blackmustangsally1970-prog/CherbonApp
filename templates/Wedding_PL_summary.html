<div class="container mt-4">

    <h2>Wedding P&L Summary Table</h2>
    <p class="text-muted">
        Net profit (net income less net expenses) for all guest tiers across AD, EA and RAJ.
    </p>

    <style>
        /* Excel-style grid */
        table.excel-grid {
            border-collapse: collapse !important;
            width: 100%;
        }
        table.excel-grid th,
        table.excel-grid td {
            border: 1px solid #999 !important;
            padding: 6px 8px !important;
        }
        table.excel-grid tr:nth-child(even) {
            background-color: #f2f2f2 !important;
        }
        table.excel-grid tr:nth-child(odd) {
            background-color: #ffffff !important;
        }
        table.excel-grid thead th {
            background-color: #e8e8e8 !important;
            font-weight: bold;
        }
    </style>

    <table class="excel-grid mt-4">
        <thead>
            <tr>
                <th>Guests</th>
                <th>AD Net </th>
                <th>EA Net </th>
                <th>RAJ Net </th>
            </tr>
        </thead>

        <tbody>
            {% for r in rows %}
            <tr>
                <td>{{ r.guests }}</td>
                <td>${{ r.ad_profit | round(2) }}</td>
                <td>${{ r.ea_profit | round(2) }}</td>
                <td>${{ r.raj_profit | round(2) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
