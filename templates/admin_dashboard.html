<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .submenu {
            list-style: none;
            padding-left: 25px;
            margin-top: 10px;
            display: none;
        }

        .submenu-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #eef2ff;
            border: 2px solid #4a6bff;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 18px;
            font-weight: 600;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: all 0.15s ease;
        }

        .submenu-btn:hover {
            background: #dce6ff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {

            .menu-btn {
                font-size: 20px;
                padding: 20px;
            }

            .submenu-btn {
                font-size: 16px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<h1>🛠 Admin Dashboard</h1>

<ul class="menu">

    <li>
        <a href="{{ url_for('minus_balances_page') }}" class="menu-btn">
            💸 Minus Balances
        </a>
    </li>

    <li>
        <a href="{{ url_for('other_tools') }}" class="menu-btn">
            🧰 Other Tools
        </a>
    </li>

    <li>
        <a href="{{ url_for('debug_page') }}" class="menu-btn">
            🛠 Debug Tools
        </a>
    </li>

    <li>
        <a href="{{ url_for('employees_home') }}" class="menu-btn">
            🧑‍🤝‍🧑 Employees
        </a>
    </li>

    <li>
        <a href="{{ url_for('daily_summary') }}" class="menu-btn">
            📊 Daily Summaries
        </a>
    </li>

    <li>
        <a href="{{ url_for('admin_users') }}" class="menu-btn">
            👤 Manage Users
        </a>
    </li>

    <li>
        <a href="#" class="menu-btn submenu-toggle">
            🧾 Receipts
        </a>

        <ul class="submenu">
            <li>
                <a href="{{ url_for('upload_receipt') }}" class="submenu-btn">
                    📸 Take Picture
                </a>
            </li>

            <li>
                <a href="{{ url_for('upload_receipt_file') }}" class="submenu-btn">
                    📁 Upload File
                </a>
            </li>

            <li>
                <a href="{{ url_for('receipt_review') }}" class="submenu-btn">
                    👀 Review Receipts
                </a>
            </li>

            <li>
                <a href="{{ url_for('receipt_recall') }}" class="submenu-btn">
                    📂 Recall / Archive
                </a>
            </li>
        </ul>
    </li>

</ul>

<script>
document.querySelectorAll('.submenu-toggle').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();

        const submenu = this.parentElement.querySelector('.submenu');

        submenu.style.display =
            submenu.style.display === 'block'
                ? 'none'
                : 'block';
    });
});
</script>

</body>
</html>
