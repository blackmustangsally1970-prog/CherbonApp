<div class="container mt-4">

    <div class="back-btn-container no-print">
        <a href="{{ url_for('dashboard') }}" class="back-btn">← Back to Menu</a>
    </div>

    <h2>Wait Staff Pricing</h2>
    <p class="text-muted">Cost per guest count.</p>

    <style>
        table.excel-grid {
            border-collapse: collapse !important;
            width: 100%;
            margin-top: 20px;
        }
        table.excel-grid th,
        table.excel-grid td {
            border: 1px solid #999 !important;
            padding: 6px 8px !important;
            white-space: nowrap;
        }
        table.excel-grid tr:nth-child(even) {
            background-color: #f2f2f2 !important;
        }
        table.excel-grid tr:nth-child(odd) {
            background-color: #ffffff !important;
        }
        table.excel-grid thead th {
            background-color: #e8e8e8 !important;
            font-weight: bold;
        }
    </style>

    <table class="excel-grid">
        <thead>
            <tr>
                <th>Guest Count</th>
                <th>Cost</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rows %}
            <tr>
                <td>{{ r.guest_count }}</td>
                <td>${{ "{:g}".format(r.cost) }}</td>
                <td>
                    <a href="{{ url_for('waitstaff_pricing_edit', id=r.id) }}"
                       class="btn btn-sm btn-warning">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
