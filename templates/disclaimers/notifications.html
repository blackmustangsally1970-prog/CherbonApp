<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incoming Submissions</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top-nav {
            margin-bottom: 25px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 20px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        h1 {
            color: #0d47a1;
            text-align: center;
            margin-bottom: 25px;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            background: #4a6bff;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            box-sizing: border-box;
            transition: 0.2s ease;
        }

        .action-btn:hover {
            background: #3557f5;
        }

        .submission-card {
            margin-top: 15px;
            background: white;
            border-radius: 18px;
            padding: 24px;
            border: 2px solid #dce6ff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .submission-id {
            font-size: 13px;
            font-weight: bold;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .submission-name {
            font-size: 24px;
            color: #222;
            font-weight: 600;
        }

        .count-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #dce6ff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
        }

        .count-number {
            font-size: 42px;
            font-weight: bold;
            color: #0d47a1;
        }

        .count-label {
            color: #666;
            margin-top: 8px;
        }

        @media (max-width: 768px) {

            body {
                padding: 12px;
            }

            h1 {
                font-size: 30px;
            }

            .submission-name {
                font-size: 22px;
            }

            .action-btn {
                font-size: 24px;
            }

            .count-number {
                font-size: 48px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="top-nav">

        <a href="{{ url_for('equestrian_dashboard') }}" class="nav-btn">
            ← Equestrian Menu
        </a>

        <a href="{{ url_for('dashboard') }}" class="nav-btn">
            🏠 Main Menu
        </a>

    </div>

    <h1>🐴 Incoming Submissions</h1>

    <a href="{{ url_for('fetch_jotform_submissions') }}"
       class="action-btn">
       🔄 Fetch New Disclaimers
    </a>

    <a href="{{ url_for('process_all_pending') }}"
       class="action-btn">
       ⚡ Process All Pending
    </a>

    <div class="count-card">
        <div class="count-number">{{ rows|length }}</div>
        <div class="count-label">Incoming Submission(s)</div>
    </div>

    {% for row in rows %}

    <div class="submission-card">

        <div class="submission-id">
            Submission #{{ row.id }}
        </div>

        <div class="submission-name">
            {{ row.display_names }}
        </div>

    </div>

    {% endfor %}

</div>

<script>
window.addEventListener("message", (event) => {
    if (event.data === "closeConflictModal") {
        if (typeof $ !== "undefined") {
            $('#conflictModal').modal('hide');
        }
    }
});
</script>

</body>
</html>
