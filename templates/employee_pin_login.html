<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Hours Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
        }

        .login-card {
            max-width: 520px;
            margin: 40px auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .login-title {
            font-family: "Brush Script MT", cursive;
            font-size: 54px;
            color: #0d47a1;
            text-align: center;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 18px;
            font-weight: 600;
        }

        .form-control {
            padding: 18px;
            font-size: 28px;
            text-align: center;
            border-radius: 12px;
            min-height: 70px;
            letter-spacing: 10px;
            font-weight: 700;
        }

        .login-btn {
            padding: 18px;
            font-size: 22px;
            font-weight: 700;
            border-radius: 12px;
            min-height: 64px;
        }

        @media (max-width: 768px) {

            .login-card {
                margin: 20px;
                padding: 32px 24px;
            }

            .login-title {
                font-size: 48px;
            }

            .form-control {
                font-size: 26px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="login-card">

            <h2 class="login-title">
                🐴 Sign in 💒
            </h2>

            <div class="subtitle">
                Enter your 6 digit staff PIN
            </div>

            <div class="mb-3">
                <label class="form-label">PIN</label>

                <input type="password"
                       id="pin"
                       class="form-control"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       inputmode="numeric"
                       autocomplete="off"
                       placeholder="••••••"
                       required>
            </div>

            <button class="btn btn-primary w-100 login-btn"
                    onclick="submitPin()">
                🔐 Login
            </button>

            <div id="error"
                 class="alert alert-danger mt-3 text-center"
                 style="display:none;">
                Invalid PIN. Please try again.
            </div>

        </div>

    </div>

    <script>
        function submitPin() {

            const pin = document.getElementById("pin").value;

            fetch("/employeehours/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "pin=" + encodeURIComponent(pin)
            })
            .then(r => r.json())
            .then(data => {

                if (data.status === "ok") {
                    window.location.href = "/employeehours/week";
                } else {
                    document.getElementById("error").style.display = "block";
                }

            })
            .catch(() => {
                document.getElementById("error").style.display = "block";
            });
        }

        document.getElementById("pin").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                submitPin();
            }
        });
    </script>

</body>
</html>
