<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Tools</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 25px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 20px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
            margin-bottom: 18px;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .flash-message {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: 600;
        }

        .flash-success {
            background: #d4ffd4;
            border: 2px solid #2e8b57;
            color: #003300;
        }

        .flash-error {
            background: #ffd4d4;
            border: 2px solid #8b2e2e;
            color: #330000;
        }

        @media (max-width: 768px) {

            h1 {
                font-size: 30px;
            }

            .menu-btn {
                font-size: 22px;
                padding: 22px;
            }

            .nav-btn {
                font-size: 20px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}

          <div class="flash-message {% if category == 'success' %}flash-success{% else %}flash-error{% endif %}">
              {{ message }}
          </div>

        {% endfor %}
      {% endif %}
    {% endwith %}

    <a href="{{ url_for('dashboard') }}" class="nav-btn">
        🏠 Main Menu
    </a>

    <h1>👥 Employee Tools</h1>

    <a href="{{ url_for('admin_employee_hours_list') }}" class="menu-btn">
        👥 Manage Employees
    </a>

    <a href="{{ url_for('admin_yearly_all') }}" class="menu-btn">
        📅 Yearly Summary (All Employees)
    </a>

    <a href="{{ url_for('admin_weekly_summary') }}" class="menu-btn">
        📊 Weekly Summary
    </a>

</div>

</body>
</html>
