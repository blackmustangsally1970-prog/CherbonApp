<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wedding P&L</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .menu-btn {
                font-size: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<h1>💒 Wedding Profit & Loss</h1>

<ul class="menu">

    <li>
        <a href="{{ url_for('wedding_dashboard_menu') }}" class="menu-btn">
            ← Wedding Menu
        </a>
    </li>

{% if current_user.role in ['admin', 'management'] %}
    <li>
        <a href="/wedding/config" class="menu-btn">
            💒 Expenses
        </a>
    </li>
{% endif %}

    <li>
        <a href="/wedding/pl/summary" class="menu-btn">
            📊 Wedding P&L Summary
        </a>
    </li>

    <li>
        <a href="/wedding/pricing" class="menu-btn">
            💰 Wedding Pricing
        </a>
    </li>

    <li>
        <a href="/waitstaff/pricing" class="menu-btn">
            🧑‍🍳 Waitstaff Pricing
        </a>
    </li>

</ul>

</html>
