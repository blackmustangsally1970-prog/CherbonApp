<div class="container mt-4">

    <div class="back-btn-container no-print mb-3">
        <a href="{{ url_for('waitstaff_pricing') }}" class="btn btn-secondary">
            ← Back to Pricing Table
        </a>
    </div>

    <div class="card shadow-sm" style="max-width: 650px; margin: auto;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Wait Staff Pricing</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <style>
                    .edit-input {
                        width: 100%;
                        height: 60px;
                        font-size: 1.3rem;
                        padding: 10px 14px;
                    }
                    .edit-label {
                        font-weight: bold;
                        margin-bottom: 6px;
                    }
                </style>

                <div class="mb-4">
                    <label class="edit-label">Guest Count</label>
                    <input type="number" name="guest_count"
                           class="form-control edit-input"
                           value="{{ row.guest_count }}" required>
                </div>

                <div class="mb-4">
                    <label class="edit-label">Cost ($)</label>
                    <input type="number" step="0.01" name="cost"
                           class="form-control edit-input"
                           value="{{ '{:g}'.format(row.cost) }}" required>
                </div>

                <button class="btn btn-success btn-lg w-100 mt-3">
                    💾 Save Changes
                </button>

            </form>

        </div>
    </div>

</div>
