<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Gift Voucher</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #0d47a1;
            text-align: center;
            margin-bottom: 25px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 20px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .form-card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            border: 2px solid #dce6ff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 700;
            color: #002060;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #dce6ff;
            border-radius: 12px;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #4a6bff;
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            color: #002060;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }

        .action-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {

            body {
                padding: 12px;
            }

            h1 {
                font-size: 30px;
            }

            input {
                font-size: 22px;
                padding: 18px;
            }

            .nav-btn,
            .action-btn {
                font-size: 24px;
                padding: 22px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Gift Voucher</h1>

    <a href="{{ url_for('gift_vouchers') }}" class="nav-btn">
        🎁 Gift Voucher Menu
    </a>

    <a href="{{ url_for('dashboard') }}" class="nav-btn">
        🏠 Main Menu
    </a>

    <div class="form-card">

        <form method="POST">

            <label>Purchaser Name</label>
            <input
                type="text"
                name="purchaser_name"
                value="{{ v.purchaser_name }}"
            >

            <label>Recipient Name</label>
            <input
                type="text"
                name="recipient_name"
                value="{{ v.recipient_name }}"
            >

            <label>Voucher Number</label>
            <input
                type="text"
                name="voucher_number"
                value="{{ v.voucher_number }}"
            >

            <label>Amount Payable</label>
            <input
                type="text"
                name="amount_payable"
                value="{{ v.amount_payable }}"
            >

            <button type="submit" class="action-btn">
                💾 Save Changes
            </button>

            <a href="{{ url_for('gift_vouchers') }}"
               class="nav-btn"
               style="margin-top:12px;">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
