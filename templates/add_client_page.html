<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add New Client</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: #0d47a1;
            text-align: center;
            margin-bottom: 25px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 20px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .form-card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            border: 2px solid #dce6ff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 700;
            color: #002060;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #dce6ff;
            border-radius: 12px;
            background: #fff;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4a6bff;
        }

        .save-btn {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            color: #002060;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .save-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {

            body {
                padding: 12px;
            }

            h1 {
                font-size: 30px;
            }

            input,
            textarea {
                font-size: 22px;
                padding: 18px;
            }

            .save-btn,
            .nav-btn {
                font-size: 24px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>👤 Add New Client</h1>

    <a href="{{ url_for('equestrian_dashboard') }}" class="nav-btn">
        ← Equestrian Menu
    </a>

    <a href="{{ url_for('dashboard') }}" class="nav-btn">
        🏠 Main Menu
    </a>

    <div class="form-card">

        <label>Full Name *</label>
        <input id="clientName" type="text" required>

        <label>Age (optional)</label>
        <input id="clientAge"
               type="number"
               inputmode="numeric">

        <label>Mobile (optional)</label>
        <input id="clientMobile"
               type="tel"
               inputmode="numeric">

        <label>Email (optional)</label>
        <input id="clientEmail"
               type="email">

        <label>Weight (kg) (optional)</label>
        <input id="clientWeight"
               type="number"
               step="0.1"
               inputmode="decimal">

        <label>Height (cm) (optional)</label>
        <input id="clientHeight"
               type="number"
               step="0.1"
               inputmode="decimal">

        <label>Notes (optional)</label>
        <textarea id="clientNotes"></textarea>

        <button id="saveClientBtn" class="save-btn">
            💾 Save Client
        </button>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("saveClientBtn").onclick = async () => {

        const name = document.getElementById("clientName").value.trim();
        const age = document.getElementById("clientAge").value.trim();
        const mobile = document.getElementById("clientMobile").value.trim();
        const email = document.getElementById("clientEmail").value.trim();
        const weight = document.getElementById("clientWeight").value.trim();
        const height = document.getElementById("clientHeight").value.trim();
        const notes = document.getElementById("clientNotes").value.trim();

        if (!name) {
            alert("Name is required");
            return;
        }

        const payload = {
            full_name: name,
            age: age || null,
            mobile: mobile || null,
            email_primary: email || null,
            weight_kg: weight || null,
            height_cm: height || null,
            notes: notes || ""
        };

        const res = await fetch("/api/add_client", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.error) {
            alert("Error: " + data.error);
            return;
        }

        alert("Client added successfully");
        window.location.href = "/client_view";
    };

});
</script>

</body>
</html>
