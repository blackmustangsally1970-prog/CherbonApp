<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Equestrian Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .menu-btn {
                font-size: 20px;
                padding: 20px;
            }
        }
    </style>
</head>



<body>

<h1>🐴 Other tools</h1>

<ul class="menu">

    <li>
        <a href="{{ url_for('dashboard') }}" class="menu-btn">
            ← Main Menu
        </a>
    </li>



    <li>
<a href="{{ url_for('admin_dashboard') }}" class="menu-btn">
    ← Admin Menu
</a>
    </li>


    <li>
        <a href="{{ url_for('manage_teachers_page') }}" class="menu-btn">
            👩‍🏫 Manage Teachers
        </a>
    </li>

    <li>
        <a href="{{ url_for('manage_horses_page') }}" class="menu-btn">
            🐴 Manage Horses
        </a>
    </li>

    <li>
<a href="{{ url_for('upgrade_items_list') }}" class="menu-btn">
    🚀 Upgrade Items
</a>
    </li>

    <li>
        <a href="{{ url_for('export_clients_xlsx') }}" class="menu-btn">
            📄 Download Clients
        </a>
    </li>

    <li>
<a href="{{ url_for('import_lessons_xlsx') }}" class="menu-btn">
    📄 Import Trails (XLSX)
</a>
    </li>

    <li>
<a href="#" class="menu-btn" onclick="document.getElementById('xlsxUpload').style.display='block'">
    📄 Import Courses (XLSX)
</a>
    </li>

    <li>
<div id="xlsxUpload" style="display:none; margin-top:20px;">
    <form action="{{ url_for('import_lessons_xlsx') }}" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx" required
               style="margin-bottom:12px; font-size:16px;">
        <button type="submit"
                style="padding:12px 20px; font-size:18px; background:#4a6bff; color:white; border:none; border-radius:8px;">
            Upload & Import
        </button>
    </form>
</div>

    </li>

</ul>

</body>
</html>
