<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cherbon Waters - Terms & Conditions</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f4f7fb;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .subtitle {
            background: #8e6c9f;
            color: white;
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .spread {
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 1;
        }

        .section-header {
            background: #8e6c9f;
            color: white;
            padding: 8px 12px;
            font-weight: 600;
            margin-top: 10px;
            border-radius: 6px 6px 0 0;
        }

        .section-body {
            background: #f7f7f7;
            border: 1px solid #d6d6d6;
            padding: 12px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .actions {
            margin-top: 30px;
            text-align: center;
        }

        .btn {
            display: inline-block;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn:hover {
            background: #08367d;
        }

        @media (max-width: 992px) {

            .spread {
                flex-direction: column;
            }

            h1 {
                font-size: 2.2rem;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Terms & Conditions</h1>

        <div class="subtitle">
            Cherbon Waters Garden Weddings & Marquee Receptions
        </div>

        <div class="spread">

            <!-- LEFT PANEL -->
            <div class="panel">

                <!-- Paste LEFT SIDE T&C sections here -->

            </div>

            <!-- RIGHT PANEL -->
            <div class="panel">

                <!-- Paste RIGHT SIDE T&C sections here -->

            </div>

        </div>

        <div class="actions">

            <a href="{{ url_for('hub.wedding_information') }}"
               class="btn">
                ← Back
            </a>

            <a href="#booking-form"
               class="btn">
                Continue
            </a>

        </div>

    </div>

</div>

</body>
</html>
