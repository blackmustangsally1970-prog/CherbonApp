<!DOCTYPE html>
<html>
<head>
    <title>Edit Wedding</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<body>
<div class="container" style="margin-top: 30px;">

    <h2>Edit Wedding</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Bride Name</label>
            <input type="text" name="bride_name" class="form-control" value="{{ wedding.bride_name }}">
        </div>

        <div class="mb-3">
            <label>Groom Name</label>
            <input type="text" name="groom_name" class="form-control" value="{{ wedding.groom_name }}">
        </div>

        <div class="mb-3">
            <label>Wedding Date</label>
            <input type="date" name="wedding_date" class="form-control"
                   value="{{ wedding.wedding_date }}">
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="hold" {% if wedding.status=='hold' %}selected{% endif %}>Hold</option>
                <option value="tentative" {% if wedding.status=='tentative' %}selected{% endif %}>Tentative</option>
                <option value="booked" {% if wedding.status=='booked' %}selected{% endif %}>Booked</option>
                <option value="cancelled" {% if wedding.status=='cancelled' %}selected{% endif %}>Cancelled</option>
                <option value="postponed" {% if wedding.status=='postponed' %}selected{% endif %}>Postponed</option>
                <option value="archived" {% if wedding.status=='archived' %}selected{% endif %}>Archived</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Notes</label>
            <textarea name="notes" class="form-control">{{ wedding.notes }}</textarea>
        </div>

        <button class="btn btn-success">Save</button>
        <a href="/weddings/calendar" class="btn btn-secondary">Cancel</a>

    </form>

</div>
</body>
</html>
