<h1>{{ item.title }}</h1>

<p>
Price:
${{ item.price_from }}
</p>

<p>
{{ item.short_description }}
</p>

<h2>Current Photos</h2>

<ul>

{% for photo in item.photos %}

    <li>

        {{ photo.filename }}

        <form
            method="POST"
            action="/weddings/inspirations/photo/{{ photo.id }}/delete"
            style="display:inline;"
        >

            <button
                type="submit"
                onclick="return confirm(
                    'Delete this photo?'
                );"
            >
                Delete
            </button>

        </form>

    </li>

{% endfor %}


</ul>

<hr>

<h2>Upload New Photo</h2>

<form
    method="POST"
    enctype="multipart/form-data"
    action="/weddings/inspirations/item/{{ item.id }}/upload"
>

    <input
        type="file"
        name="photo"
        required
    >

    <br><br>

    <input
        type="text"
        name="caption"
        placeholder="Photo caption"
    >

    <br><br>

    <button type="submit">

        Upload Photo

    </button>

</form>
