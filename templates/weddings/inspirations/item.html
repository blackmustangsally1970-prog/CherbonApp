<h1>{{ item.title }}</h1>

<p>
    Price From:
    ${{ item.price_from }}
</p>

<p>
    {{ item.short_description }}
</p>

<h2>Photos</h2>

<ul>
{% for photo in item.photos %}

    <div>

        <img
            src="{{ url_for(
                'static',
                filename='uploads/inspirations/' ~ photo.filename
            ) }}"
            style="max-width:600px;"

        >

        <br>

        {{ photo.caption }}

    </div>

{% endfor %}</ul>
