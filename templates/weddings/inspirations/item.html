<h1>{{ item.title }}</h1>

<p>
    Price From:
    ${{ item.price_from }}
</p>

<p>
    {{ item.short_description }}
</p>

<h2>Photos</h2>

{% for photo in item.photos %}

<div style="margin-bottom:20px;">

    <img
        src="{{ url_for(
            'static',
            filename='uploads/inspirations/' ~ photo.filename
        ) }}"
        style="
            max-width:600px;
            border-radius:8px;
        "
    >

    <br>

    {{ photo.caption }}

</div>

{% else %}

<p>No photos found.</p>

{% endfor %}
