<!DOCTYPE html>
<html>
<head>
    <title>Master Job List</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<body>

<div class="container" style="margin-top: 30px; max-width: 1100px;">

    <h2 class="page-title">🧰 Master Job List</h2>
    <p class="page-subtitle">Your master checklist — items here can be inserted into any wedding.</p>

    <div class="top-links">
        <a href="/weddings/calendar" class="menu-btn-small">← Back to Calendar</a>
    </div>

    <!-- ⭐ EXCEL TABLE -->
    <table class="table table-sm excel-table">
        <thead>
            <tr>
                <th style="width:140px;">Role</th>
                <th>Description</th>
                <th style="width:80px;" class="text-center">Active</th>
                <th style="width:100px;" class="text-center">Order</th>
                <th style="width:140px;" class="text-center">Actions</th>
            </tr>
        </thead>

        <tbody>

            <!-- ⭐ ADD NEW JOB ROW -->
            <tr class="excel-row">
                <form method="POST" action="/weddings/job_master/add">
                    <td>
                        <select name="role" class="form-control form-control-sm">
                            <option value="coordinator">Coordinator</option>
                            <option value="wait">Wait</option>
                        </select>
                    </td>

                    <td>
                        <textarea name="description" class="form-control form-control-sm" rows="2"
                                  placeholder="Job description"></textarea>
                    </td>

                    <td></td>
                    <td></td>

                    <td>
                        <button class="btn btn-success btn-sm w-100">Add</button>
                    </td>
                </form>
            </tr>

            <!-- ⭐ EXISTING JOBS -->
            {% for j in jobs %}
            <tr class="excel-row">
                <form method="POST" action="/weddings/job_master/update/{{ j.id }}">

                    <!-- Role -->
                    <td>
                        <select name="role" class="form-control form-control-sm">
                            <option value="coordinator" {% if j.role=='coordinator' %}selected{% endif %}>Coordinator</option>
                            <option value="wait" {% if j.role=='wait' %}selected{% endif %}>Wait</option>
                        </select>
                    </td>

                    <!-- Description -->
                    <td>
                        <textarea name="description" class="form-control form-control-sm" rows="2">{{ j.description }}</textarea>
                    </td>

                    <!-- Active -->
                    <td class="text-center">
                        <input type="checkbox" name="active" {% if j.active %}checked{% endif %}>
                    </td>

                    <!-- Order -->
                    <td class="text-center">
                        <a href="/weddings/job_master/move_up/{{ j.id }}" class="btn btn-light btn-sm">⬆</a>
                        <a href="/weddings/job_master/move_down/{{ j.id }}" class="btn btn-light btn-sm">⬇</a>
                    </td>

                    <!-- Actions -->
                    <td class="text-center">
                        <button class="btn btn-primary btn-sm w-100 mb-1">Update</button>

                        <button type="button"
                                class="btn btn-danger btn-sm w-100"
                                onclick="if(confirm('Delete job?')) window.location='/weddings/job_master/delete/{{ j.id }}';">
                            Delete
                        </button>
                    </td>

                </form>
            </tr>
            {% endfor %}

        </tbody>
    </table>

</div>

<style>

.page-title {
    margin-bottom: 10px;
}

.page-subtitle {
    margin-bottom: 20px;
    color: #555;
}

.top-links {
    margin-bottom: 20px;
}

.excel-table {
    background: #fff;
    border: 1px solid #ccc;
    font-size: 0.9rem;
}

.excel-table th {
    background: #f3f3f3;
    font-weight: 600;
    border-bottom: 2px solid #ccc;
}

.excel-row td {
    vertical-align: middle;
    padding: 6px;
}

textarea.form-control-sm {
    resize: vertical;
}

.menu-btn-small {
    background: #eee;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.95rem;
    color: #333;
}

.menu-btn-small:hover {
    background: #ddd;
}

</style>

</body>
</html>
