<!DOCTYPE html>
<html>
<head>
    <title>Master Job List</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<body>
<div class="container" style="margin-top: 30px;">

    <h2>Master Job List</h2>
    <p>This is your master checklist. Items here can be inserted into any wedding.</p>

    <hr>

    <h4>Add New Job</h4>
    <form method="POST" action="/weddings/job_master/add">

        <div class="row">
            <div class="col-md-3">
                <select name="role" class="form-control">
                    <option value="coordinator">Coordinator</option>
                    <option value="wait">Wait</option>
                    <option value="bar">Bar</option>
                    <option value="floater">Floater</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="col-md-6">
                <input type="text" name="description" class="form-control" placeholder="Job description">
            </div>

            <div class="col-md-2">
                <input type="number" name="sort_order" class="form-control" placeholder="Order">
            </div>

            <div class="col-md-1">
                <button class="btn btn-success">Add</button>
            </div>
        </div>

    </form>

    <hr>

    <h4>Existing Jobs</h4>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Role</th>
                <th>Description</th>
                <th>Sort Order</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for j in jobs %}
            <tr>
                <form method="POST" action="/weddings/job_master/update/{{ j.id }}">
                    <td>
                        <select name="role" class="form-control">
                            <option value="coordinator" {% if j.role=='coordinator' %}selected{% endif %}>Coordinator</option>
                            <option value="wait" {% if j.role=='wait' %}selected{% endif %}>Wait</option>
                            <option value="bar" {% if j.role=='bar' %}selected{% endif %}>Bar</option>
                            <option value="floater" {% if j.role=='floater' %}selected{% endif %}>Floater</option>
                            <option value="admin" {% if j.role=='admin' %}selected{% endif %}>Admin</option>
                        </select>
                    </td>

                    <td>
                        <input type="text" name="description" class="form-control" value="{{ j.description }}">
                    </td>

                    <td>
                        <input type="number" name="sort_order" class="form-control" value="{{ j.sort_order }}">
                    </td>

                    <td>
                        <input type="checkbox" name="active" {% if j.active %}checked{% endif %}>
                    </td>

                    <td>
                        <button class="btn btn-primary btn-sm">Update</button>
                        <a href="/weddings/job_master/delete/{{ j.id }}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete job?');">Delete</a>
                    </td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <hr>

    <a href="/weddings/calendar" class="btn btn-secondary">Back to Calendar</a>

</div>
</body>
</html>
