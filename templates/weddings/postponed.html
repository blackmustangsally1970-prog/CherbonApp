<!DOCTYPE html>
<html>
<head>
    <title>Postponed Weddings</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<body>

<div class="container" style="margin-top: 30px;">

    <h2>⏳ Postponed Weddings</h2>
    <p>These weddings are awaiting a new date assignment.</p>

    <table class="table table-bordered table-striped mt-3">
        <thead>
            <tr>
                <th>Original Date</th>
                <th>Bride & Groom</th>
                <th>Reason</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for w in weddings %}
            <tr>
                <td>{{ w.wedding_date.strftime('%d/%m/%Y') }}</td>
                <td>{{ w.bride_name }} & {{ w.groom_name }}</td>
                <td>{{ w.postpone_reason or "No reason provided" }}</td>
                <td>
                    <a href="{{ url_for('hub.wedding_hub', wedding_id=w.id) }}" class="btn btn-primary btn-sm">
                        Open
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
