<!DOCTYPE html>
<html>
<head>
    <title>Wedding Calendar</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<body>
<div class="container" style="margin-top: 30px;">

    <h2>Wedding Calendar</h2>

    <div style="margin-bottom:20px;">
        <a href="/weddings/add" class="btn btn-primary btn-sm">Add Wedding</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Date</th>
                <th>Bride</th>
                <th>Groom</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for w in weddings %}
            <tr>
                <td>{{ w.date }}</td>
                <td>{{ w.bride }}</td>
                <td>{{ w.groom }}</td>
                <td>{{ w.status }}</td>

                <td>
                    <a href="/weddings/edit/{{ w.id }}" class="btn btn-sm btn-info">Edit</a>
                    <a href="/weddings/delete/{{ w.id }}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this wedding?');">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
</body>
</html>
