<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Appointments Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

.badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    margin-left: 10px;
    border-radius: 999px;
    background: #ff3b30;
    color: white;
    font-size: 14px;
    font-weight: bold;
}

.pipeline-badge {
    background: #7a36ff;
}



        @media (max-width: 768px) {
            .menu-btn {
                font-size: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<h1>📅 Appointments Dashboard</h1>

<ul class="menu">

    <li>
        <a href="{{ url_for('wedding_dashboard_menu') }}" class="menu-btn">
            ← Wedding Dashboard
        </a>
    </li>

    <li>
        <a href="{{ url_for('hub.appointment_slots') }}" class="menu-btn">
            📅 Manage Slots
        </a>
    </li>

    <li>
        <a href="{{ url_for('hub.appointment_slot_add') }}" class="menu-btn">
            ➕ Add Appointment Slot
        </a>
    </li>

<li>
    <a href="{{ url_for('hub.appointments_admin') }}" class="menu-btn">
        👥 View Bookings

        {% if bookings_count > 0 %}
        <span class="badge">
            {{ bookings_count }}
        </span>
        {% endif %}

    </a>
</li>

<li>
    <a href="{{ url_for('hub.appointments_pipeline') }}" class="menu-btn">
        📈 Lead Pipeline

        {% if pipeline_count > 0 %}
        <span class="badge pipeline-badge">
            {{ pipeline_count }}
        </span>
        {% endif %}

    </a>
</li>

<li>
    <a href="{{ url_for('hub.appointments_archive') }}" class="menu-btn">
        📊 Lead Archive
    </a>
</li>

</ul>

</body>
</html>
