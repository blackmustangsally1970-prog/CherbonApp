<!doctype html>
<html>
<head>
    <title>Add Appointment Slot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4" style="max-width:600px;">

    <h1>💒 Add Appointment Slot</h1>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">
                Date
            </label>

<input
    type="date"
    name="appointment_date"
    class="form-control"
    value="{{ today }}"
    required>

        </div>

        <div class="mb-3">
            <label class="form-label">
                Time
            </label>

<select
    name="appointment_time"
    class="form-select"
    required>

    <option value="">Select Time</option>

    {% for hour in range(6, 19) %}
        {% for minute in [0, 15, 30, 45] %}

            <option value="{{ '%02d:%02d' % (hour, minute) }}">
                {{ ((hour - 1) % 12) + 1 }}:{{ '%02d' % minute }} {{ 'AM' if hour < 12 else 'PM' }}
            </option>

        {% endfor %}
    {% endfor %}

</select>

        </div>

        <div class="form-check mb-4">
            <input
                class="form-check-input"
                type="checkbox"
                name="is_available"
                checked>

            <label class="form-check-label">
                Available
            </label>
        </div>

        <button class="btn btn-success">
            Save Slot
        </button>

        <a href="{{ url_for('hub.appointment_slots') }}"
           class="btn btn-secondary">

            Cancel
        </a>

    </form>

</div>

</body>
</html>
