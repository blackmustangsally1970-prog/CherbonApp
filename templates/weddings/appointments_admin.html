<!DOCTYPE html>
<html>


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Viewing Appointments</title>
</head>


<style>
.appointment-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.appointment-card h3 {
    margin-top: 0;
    color: #0d47a1;
}

.appointment-card p {
    margin: 8px 0;
    color: #444;
}
</style>



<body>


<div class="container py-4">

    <h3 class="mb-4">Viewing Appointments</h3>

{% for a in appointments %}

<div class="appointment-card">

    <h3>{{ a.name }}</h3>

    <p>📅 {{ a.day.strftime('%d/%m/%Y') }}</p>

    <p>🕒 {{ a.time_label }}</p>

    <p>📱 {{ a.phone }}</p>

    <p>📧 {{ a.email }}</p>

    <p>Status: {{ a.status }}</p>

</div>

{% endfor %}
</div>

</body>

</html>
