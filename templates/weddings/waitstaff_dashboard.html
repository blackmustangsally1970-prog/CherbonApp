<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wait Staff Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .menu {
            list-style: none;
            padding: 0;
            max-width: 700px;
            margin: auto;
        }

        .menu li {
            margin-bottom: 18px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .coming-soon {
            margin-top: 30px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .coming-soon h3 {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .menu-btn {
                font-size: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<h1>👥 Wait Staff Dashboard</h1>

<ul class="menu">

    <li>
        <a href="#" class="menu-btn">
            💒 Today's Wedding
        </a>
    </li>

    <li>
        <a href="#" class="menu-btn">
            ✅ Assigned Tasks
        </a>
    </li>

    <li>
        <a href="#" class="menu-btn">
            📸 Upload Photos
        </a>
    </li>

    <li>
        <a href="#" class="menu-btn">
            ⚠ Report Issues
        </a>
    </li>

</ul>

<div class="coming-soon">
    <h3>🚀 Coming Soon</h3>

    <p>
        Wait Staff role is active and working.
    </p>

    <p>
        This dashboard will become the operational workstation for assigned weddings,
        task completion, photo uploads and issue reporting.
    </p>

</div>

</body>
</html>
