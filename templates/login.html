<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Staff Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        .login-card {
            max-width: 450px;
            margin: 60px auto;
            background: #fff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .login-title {
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-control {
            padding: 14px;
            font-size: 18px;
            border-radius: 10px;
        }

        .login-btn {
            padding: 14px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">Staff Login</span>
        </div>
    </nav>

    <div class="login-card">

        <h2 class="login-title">Welcome</h2>

        <form method="POST" autocomplete="off">

            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input list="usernames" name="user" class="form-control"
                       placeholder="Enter username" required>
            </div>

            <datalist id="usernames">
                <option value="steve">
                <option value="trevor">
                <option value="tamara">
            </datalist>

            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter password" required>
            </div>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100 login-btn">
                Login
            </button>

        </form>

    </div>

</body>
</html>
