<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Staff Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>

        body {
            background: #f4f7fb;
        }

        .login-card {
            max-width: 520px;
            margin: 30px auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            color: #0d47a1;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 18px;
        }

        .form-control {
            padding: 18px;
            font-size: 20px;
            border-radius: 12px;
            min-height: 62px;
        }

        .login-btn {
            padding: 18px;
            font-size: 22px;
            font-weight: 700;
            border-radius: 12px;
            min-height: 62px;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
        }

.login-title {
    font-family: "Brush Script MT", cursive;
    font-size: 54px;
    color: #0d47a1;
    text-align: center;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    margin-bottom: 30px;
}


        @media (max-width: 768px) {

            body {
                margin: 0;
            }

            .login-card {
                margin: 20px;
                padding: 32px 24px;
                max-width: none;
            }

            .login-title {
                font-size: 24px;
            }

            .form-control {
                font-size: 20px;
                min-height: 64px;
            }

            .login-btn {
                font-size: 24px;
                min-height: 64px;
            }
        }


    </style>
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">Staff Login</span>
        </div>
    </nav>

    <div class="login-card">

        <h2 class="login-title">🐴 Cherbon Waters 💒</h2>

        <form method="POST" autocomplete="off">

            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input list="usernames" name="user" class="form-control"
                       placeholder="Enter username" required>
            </div>

            <datalist id="usernames">
                <option value="steve">
                <option value="trevor">
                <option value="tamara">
            </datalist>

            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter password" required>
            </div>

            {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100 login-btn">
                Login
            </button>

        </form>

    </div>




</body>
</html>
