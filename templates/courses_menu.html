<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses Menu</title>

<style>

    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 15px;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        color: #0d47a1;
        text-align: center;
        margin-bottom: 25px;
    }

    .nav-btn {
        display: block;
        width: 100%;
        padding: 18px;
        margin-bottom: 12px;
        background: #dce6ff;
        border: 3px solid #4a6bff;
        border-radius: 16px;
        text-decoration: none;
        text-align: center;
        color: #002060;
        font-size: 20px;
        font-weight: 700;
        box-sizing: border-box;
        transition: all 0.15s ease;
    }

    .nav-btn:hover {
        background: #cddcff;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {

        body {
            padding: 12px;
        }

        h1 {
            font-size: 30px;
        }

        .nav-btn {
            font-size: 24px;
            padding: 22px;
        }
    }

</style></head>

<body>

<div class="container">

    <h1>📘 Courses Menu</h1>

    <a href="{{ url_for('equestrian_dashboard') }}" class="nav-btn">
        ← Equestrian Menu
    </a>

    <a href="{{ url_for('dashboard') }}" class="nav-btn">
        🏠 Main Menu
    </a>

    <a href="{{ url_for('course_form_submissions') }}" class="nav-btn">
        📥 Course Submissions
    </a>

    <a href="{{ url_for('course_reference') }}" class="nav-btn">
        📘 Course Reference Table
    </a>

    <a href="{{ url_for('pricing_setup') }}" class="nav-btn">
        💲 Pricing Setup
    </a>

    <a href="{{ url_for('terms') }}" class="nav-btn">
        📅 Term Setup
    </a>

</div>
</body>
</html>
