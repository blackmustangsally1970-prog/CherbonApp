<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Manage Teachers</title>

    <style>
        body { font-family: sans-serif; margin: 20px; }

.action-btn {
    display: inline-block;
    padding: 12px 20px;
    margin: 0 8px 12px 0;
    background: linear-gradient(135deg, #2a7ae2, #1f5fc4);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    transition: all 0.15s ease;
}

.action-btn:hover {
    background: linear-gradient(135deg, #3a89ef, #2a7ae2);
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.20);
    color: #fff;
    text-decoration: none;
}
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; font-size: 14px; }
        th { background: #f2f2f2; }
        form { margin: 0; }
    </style>
</head>

<body>

<a href="{{ url_for('dashboard') }}" class="action-btn">
    ← Main Menu
</a>

<a href="{{ url_for('admin_dashboard') }}" class="action-btn">
    ← Admin Menu
</a>

<a href="{{ url_for('lessons_by_date') }}" class="action-btn">
    📅 View Lessons by Date
</a>

<h1>Manage Teachers</h1>

<form method="POST" action="{{ url_for('add_teacher') }}">
    <input type="text" name="teacher" placeholder="New teacher name" required>
    <button type="submit">Add Teacher</button>
</form>

<table>
    <tr>
        <th>Name</th>
        <th>Delete</th>
    </tr>

    {% for t in teachers %}
    <tr>
        <td>{{ t.teacher }}</td>
        <td>
            <form method="POST" action="{{ url_for('delete_teacher', tid=t.teacher_id) }}">
                <button type="submit" onclick="return confirm('Delete teacher?')">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
