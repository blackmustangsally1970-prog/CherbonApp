<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Yearly Summary - Active Staff</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            background: #dce6ff;
            border: 3px solid #4a6bff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 20px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: #cddcff;
            transform: translateY(-2px);
        }

        .staff-btn {
            display: block;
            width: 100%;
            padding: 24px;
            background: white;
            border: 2px solid #dce6ff;
            border-radius: 16px;
            text-decoration: none;
            text-align: center;
            color: #002060;
            font-size: 24px;
            font-weight: 700;
            box-sizing: border-box;
            transition: all 0.15s ease;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .staff-btn:hover {
            background: #f8fbff;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {

            h1 {
                font-size: 30px;
            }

            .staff-btn {
                font-size: 22px;
                padding: 22px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <a href="/employees" class="nav-btn">
        👥 Employee Menu
    </a>

    <h1>📅 Yearly Summary</h1>

    <div class="subtitle">
        Showing {{ employees|length }} active staff members
    </div>

    {% for e in employees %}

        <a href="{{ url_for('admin_employee_yearly_summary', acc_id=e.id) }}"
           class="staff-btn">

            👤 {{ e.full_name }}

        </a>

    {% endfor %}

</div>

</body>
</html>
