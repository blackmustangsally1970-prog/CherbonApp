<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yearly Summary – Active Staff</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }

    .header-bar {
        background:#4a6bff;
        color:white;
        padding:20px 30px;
        border-radius:12px;
        margin-bottom:30px;
        font-size:28px;
        font-weight:800;
    }

    .back-btn {
        background:#eee;
        border:2px solid #999;
        padding:10px 18px;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        margin-bottom:25px;
    }

    .back-btn:hover {
        background:#ddd;
    }

    .menu-btn {
      display: block;
      width: 100%;
      background: #dce6ff;
      border: 4px solid #4a6bff;
      padding: 40px 28px;
      border-radius: 18px;
      font-size: 34px;
      font-weight: 900;
      color: #001a66;
      text-decoration: none;
      text-align: center;
      box-sizing: border-box;
      letter-spacing: 1px;
      line-height: 1.35;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-bottom: 32px;
    }

    .menu-btn:hover {
      background: #c7d6ff;
      transform: scale(1.04);
      text-decoration: none;
    }

    @media (min-width: 800px) {
      .menu-btn {
        padding: 20px 18px !important;
        font-size: 20px !important;
        border-radius: 10px !important;
        margin-bottom: 20px !important;
      }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='/employees'">
    Employee Menu
</button>

<div class="header-bar">Yearly Summary – Active Staff</div>

<div style="font-size:18px; margin-bottom:20px; color:#333;">
    Showing {{ employees|length }} active staff members
</div>

<div class="container">
  {% for e in employees %}
    <a href="{{ url_for('admin_employee_yearly_summary', acc_id=e.id) }}" class="menu-btn">
        📅 {{ e.full_name }}
    </a>
  {% endfor %}
</div>

</body>
</html>
